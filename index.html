<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>Tappity</title>

<style>

body {
  margin: 0;

  min-height: 100vh;

  display: flex;

  align-items: center;

  justify-content: center;

  background: #10131c;

  color: white;

  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}


.container {
  text-align: center;

  padding: 30px;
}


h1 {
  font-size:
    clamp(3rem,10vw,6rem);

  margin:
    0 0 10px;

  color:
    #ffd84d;
}


p {
  color:
    #abb3c8;

  margin:
    0 0 30px;

  font-size:
    1.1rem;
}


.versions {
  display: flex;

  flex-direction: column;

  gap: 12px;

  align-items: center;
}


a {
  display: block;

  width:
    min(280px,75vw);

  padding:
    16px 28px;

  border-radius:
    16px;

  background:
    #ffd84d;

  color:
    #171717;

  font-weight:
    800;

  text-decoration:
    none;

  font-size:
    1.05rem;

  box-sizing:
    border-box;
}


a:active {
  transform:
    scale(.98);
}

</style>

</head>


<body>


<div class="container">

  <h1>
    TAPPITY!
  </h1>

  <p>
    Choose a version
  </p>


  <div class="versions">

    <a href="v1/">
      Play V1
    </a>

    <a href="v2/">
      Play V2
    </a>

    <a href="v3/">
      Play V3
    </a>

  </div>

</div>


</body>

</html>
